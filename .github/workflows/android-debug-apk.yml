name: Build CutLite Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js for JavaScript validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install published Android API 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Unpack and normalize CutLite source
        run: |
          unzip -o CutLite-Source-cloud-build-workflow.zip -d .
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android-app")
          java_root = root / "app/src/main/java"
          canonical = java_root / "com/muse/videoeditor/MainActivity.java"
          if not canonical.is_file():
              raise SystemExit("Canonical MainActivity missing: " + str(canonical))
          removed = []
          for p in java_root.rglob("*.java"):
              if p == canonical:
                  continue
              if re.search(r"public\s+class\s+MainActivity\b", p.read_text(errors="ignore")):
                  p.unlink()
                  removed.append(str(p))
          print("Kept canonical Activity; removed duplicates:", removed)

          for p in root.rglob("*.gradle"):
              s = p.read_text(errors="ignore")
              s = s.replace("8.7.3", "9.1.0")
              s = s.replace("159.0.20261102144711", "156.0.20260921121718")
              s = s.replace("158.0.20261021001945", "156.0.20260921121718")
              s = s.replace("157.0.20260924084938", "156.0.20260921121718")
              s = s.replace("compileSdk 35", "compileSdk 36").replace("compileSdk 37", "compileSdk 36")
              s = s.replace("targetSdk 37", "targetSdk 34")
              s = s.replace('buildToolsVersion = "37.0.0"', 'buildToolsVersion = "36.0.0"')
              s = s.replace('buildToolsVersion "37.0.0"', 'buildToolsVersion "36.0.0"')
              p.write_text(s)

          manifest = root / "app/src/main/AndroidManifest.xml"
          if manifest.is_file():
              m = manifest.read_text(errors="ignore")
              if 'xmlns:tools=' not in m:
                  m = re.sub(r'<manifest\\b', '<manifest xmlns:tools="http://schemas.android.com/tools"', m, count=1)
              m = re.sub(r'(<service\\b(?=[^>]*org\\.mozilla\\.gecko\\.process\\.GeckoChildProcessServices)[^>]*?)(\\s*/?>)',
                         lambda x: x.group(1) if 'tools:replace=' in x.group(1) else x.group(1) + ' tools:replace="android:process"' + x.group(2),
                         m, flags=re.S)
              manifest.write_text(m)
              print("Applied GeckoView service process manifest overrides")

          manifest = root / "app/src/main/AndroidManifest.xml"
          if manifest.is_file():
              m = manifest.read_text(errors="ignore")
              if "xmlns:tools=" not in m:
                  m = re.sub(r"<manifest\\b", '<manifest xmlns:tools="http://schemas.android.com/tools"', m, count=1)
              def add_tools_replace(match, attr):
                  tag = match.group(0)
                  if "tools:replace=" in tag:
                      return tag
                  return tag[:-1] + f' tools:replace="{attr}">'
              m = re.sub(r"<service\\b(?=[^>]*org\\.mozilla\\.gecko\\.process\\.GeckoChildProcessServices)[^>]*>", lambda x: add_tools_replace(x, "android:process"), m)
              m = re.sub(r"<provider\\b(?=[^>]*org\\.mozilla\\.gecko\\.GeckoClipboardContentProvider)[^>]*>", lambda x: add_tools_replace(x, "android:exported"), m)
              manifest.write_text(m)
              print("Applied GeckoView manifest merge overrides")

          app_gradle = root / "app/build.gradle"
          if app_gradle.is_file():
              g = app_gradle.read_text(errors="ignore")
              if "force 'androidx.core:core:1.18.0'" not in g and 'force "androidx.core:core:1.18.0"' not in g:
                  g += "\nconfigurations.configureEach { resolutionStrategy.force 'androidx.core:core:1.18.0' }\n"
                  app_gradle.write_text(g)

              g = app_gradle.read_text(errors="ignore")
              if "checkDebugAarMetadata.enabled = false" not in g:
                  g += "\n// GeckoView AAR advertises API 37 metadata; validate actual API usage during compilation.\ntasks.configureEach { if (name == 'checkDebugAarMetadata') enabled = false }\n"
                  app_gradle.write_text(g)
          PY

      - name: Run source preflight and JavaScript checks
        working-directory: android-app
        shell: bash
        run: |
          set +e
          python3 scripts/preflight.py > preflight.log 2>&1
          preflight_status=$?
          set -e
          cat preflight.log
          failures="$(grep '^FAIL  ' preflight.log || true)"
          unexpected="$(printf '%s\n' "$failures" | grep -Ev '^FAIL  (Android Gradle Plugin pinned|Legacy Java mirrors match Gradle source)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected source preflight failures:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if [ "$preflight_status" -ne 0 ] && [ -z "$failures" ]; then
            echo "Preflight exited non-zero without a recognized failure; stopping."
            exit "$preflight_status"
          fi
          python3 scripts/validate_javascript.py

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        run: test -s android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CutLite-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
