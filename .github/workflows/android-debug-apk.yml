name: Build CutLite Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js for JavaScript validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install published Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Unpack and normalize CutLite source
        run: |
          unzip -o CutLite-Source-cloud-build-workflow.zip -d .
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android-app")
          java_root = root / "app/src/main/java"
          canonical = java_root / "com/muse/videoeditor/MainActivity.java"
          if not canonical.is_file():
              raise SystemExit("Canonical MainActivity missing: " + str(canonical))
          removed = []
          for p in java_root.rglob("*.java"):
              if p == canonical:
                  continue
              if re.search(r"public\\s+class\\s+MainActivity\\b", p.read_text(errors="ignore")):
                  p.unlink()
                  removed.append(str(p))
          print("Kept canonical Activity; removed duplicates:", removed)

          for p in root.rglob("*.gradle"):
              s = p.read_text(errors="ignore")
              s = s.replace("159.0.20261102144711", "158.0.20261021001945")
              s = s.replace("158.0.20260923091338", "158.0.20261021001945")
              p.write_text(s)
          PY

      - name: Run source preflight and JavaScript checks
        working-directory: android-app
        run: |
          python3 scripts/preflight.py
          python3 scripts/validate_javascript.py

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        run: test -s android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CutLite-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
